# Copy this file to values.secret.yaml (gitignored) and fill in real values.
# Pass it to helm as an extra values file, e.g.:
#   helm upgrade --install -f values.yaml -f values.secret.yaml mimir .
aws:
  accountId: "123456789012"

serviceAccount:
  annotations:
    eks.amazonaws.com/audience: "sts.amazonaws.com"
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "3000"
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/Loki"
